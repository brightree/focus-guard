# 윈도우 앱: 테스트 → 빌드 → 앱 자체 점검 → (릴리스면) FocusGuard-Windows.zip 첨부
name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', 'app/VERSION', '.github/workflows/windows.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core tests
        run: dotnet test windows/FocusGuard.Core.Tests -c Release

      - name: Publish (single exe)
        run: dotnet publish windows/FocusGuard.App -c Release -o out

      - name: Self test (all windows, timer, server, UI Automation)
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process -FilePath out\FocusGuard.exe -ArgumentList '--selftest', $log -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Chrome address bar check (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\chrome.log"
          $p = Start-Process -FilePath out\FocusGuard.exe -ArgumentList '--selftest', $log, '--chrome' -Wait -PassThru
          Get-Content $log | Select-String 'chrome'
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\FocusGuard.exe -DestinationPath FocusGuard-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-Windows
          path: FocusGuard-Windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" FocusGuard-Windows.zip --clobber
